<!-- Dividi le spese tra amici: spese senza limiti al giorno, conti fatti al centesimo, il minimo di bonifici per pareggiare. -->
<!-- I dati restano nel browser (localStorage). "Copia il riepilogo" dà il testo da incollare nel gruppo e funziona sempre.
     Se la pagina è su un sito pubblico (https), compare anche "Copia il link": i dati vanno nel link dopo il #, parte che non arriva a nessun server. -->


<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dividi le spese · bino.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --carta: #F2EEE3; --nero: #141414; --verde: #3FE08F; --giallo: #FFD93D; --rosso: #FF4D4D; --bianco: #FFFDF7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--nero); font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--carta) radial-gradient(#14141418 1.2px, transparent 1.2px) 0 0 / 22px 22px;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 40px; line-height: 1.05; margin: 0 0 6px; }
  h1 mark { background: var(--verde); padding: 0 6px; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  .sotto { margin: 0 0 24px; font-size: 17px; }
  .adesivo { display: inline-block; font: 700 14px "JetBrains Mono", monospace; letter-spacing: 1px; background: var(--giallo); border: 3px solid var(--nero); border-radius: 999px; padding: 4px 12px; transform: rotate(-2deg); margin-bottom: 14px; }
  .scheda { background: var(--bianco); border: 4px solid var(--nero); border-radius: 18px; box-shadow: 8px 8px 0 var(--nero); padding: 22px; margin-bottom: 22px; }
  input, select {
    font: 500 17px "Space Grotesk", sans-serif; padding: 11px 12px; height: 48px;
    border: 3px solid var(--nero); border-radius: 12px; background: #fff; min-width: 0;
  }
  .riga { display: flex; gap: 10px; flex-wrap: wrap; }
  .riga > * { flex: 1; }
  button {
    font: 700 17px "Space Grotesk", sans-serif; padding: 0 18px; height: 48px; cursor: pointer;
    border: 3px solid var(--nero); border-radius: 999px; background: var(--verde); box-shadow: 4px 4px 0 var(--nero); flex: none;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--nero); }
  button.giallo { background: var(--giallo); }
  .chip { display: inline-flex; align-items: center; gap: 6px; margin: 10px 8px 0 0; padding: 6px 8px 6px 14px; border: 3px solid var(--nero); border-radius: 999px; background: #fff; font-weight: 700; }
  .chip button { height: 26px; width: 26px; padding: 0; box-shadow: none; border-width: 2px; background: var(--bianco); font-size: 13px; }
  .tra { margin-top: 12px; font-size: 15px; }
  .tra label { display: inline-flex; align-items: center; gap: 6px; margin: 6px 14px 0 0; font-weight: 700; }
  .tra input { height: 20px; width: 20px; }
  .spesa { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 2px dashed #14141430; }
  .spesa:last-child { border-bottom: 0; }
  .spesa .cosa { flex: 1; }
  .spesa .cosa small { display: block; font-size: 13px; }
  .spesa .soldi { font: 700 17px "JetBrains Mono", monospace; }
  .spesa button { height: 32px; width: 32px; padding: 0; box-shadow: none; border-width: 2px; background: var(--bianco); font-size: 14px; }
  .saldo { display: flex; justify-content: space-between; font: 700 17px "JetBrains Mono", monospace; padding: 6px 0; }
  .piu { color: #0B8A4B; }
  .meno { color: #C42020; }
  .bonifico { margin-top: 10px; padding: 12px 14px; border: 3px solid var(--nero); border-radius: 12px; background: var(--giallo); font-weight: 700; font-size: 18px; }
  .vuoto { font-size: 15px; margin: 4px 0 0; }
  .errore { color: var(--rosso); font-weight: 700; font-size: 15px; margin: 8px 0 0; }
  .azioni { display: flex; gap: 12px; flex-wrap: wrap; }
  footer { font-size: 14px; text-align: center; }
  footer a { color: var(--nero); }
</style>
</head>
<body>
<main>
  <span class="adesivo">SPESE ILLIMITATE · ZERO PUBBLICITÀ</span>
  <h1>Dividi le <mark>spese</mark></h1>
  <p class="sotto">Vacanza, casa, cena: scrivi chi ha pagato cosa. Ti dice chi deve dare quanto a chi, con il minimo di bonifici.</p>

  <div class="scheda">
    <h2>1 · Chi c'è</h2>
    <div class="riga">
      <input id="nuovoNome" placeholder="Nome (es. Marta)" maxlength="24">
      <button id="aggiungiNome">Aggiungi</button>
    </div>
    <div id="persone"></div>
  </div>

  <div class="scheda">
    <h2>2 · Le spese</h2>
    <div class="riga">
      <input id="cosa" placeholder="Cosa (es. benzina)" maxlength="40">
      <input id="quanto" placeholder="€" inputmode="decimal" style="max-width: 120px">
    </div>
    <div class="riga" style="margin-top: 10px">
      <select id="chiPaga"></select>
      <button id="aggiungiSpesa">Aggiungi spesa</button>
    </div>
    <div class="tra" id="tra"></div>
    <p id="erroreSpesa" class="errore" hidden></p>
    <div id="spese" style="margin-top: 12px"></div>
  </div>

  <div class="scheda">
    <h2>3 · Chi deve a chi</h2>
    <div id="saldi"></div>
    <div id="bonifici"></div>
  </div>

  <div class="azioni" style="margin-bottom: 22px">
    <button class="giallo" id="riepilogo">Copia il riepilogo per il gruppo</button>
    <button class="giallo" id="condividi" hidden>Copia il link con i dati</button>
    <button class="giallo" id="azzera" style="background: var(--bianco)">Ricomincia</button>
  </div>

  <footer>Fatto con Claude da <a href="https://www.instagram.com/bino.devs/">@bino.devs</a> · codice su <a href="https://github.com/BinoITA/bino-dev-reels">github.com/BinoITA/bino-dev-reels</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const CHIAVE = "bino-dividi-spese";
  // Stato: persone = ["Marta", ...]; spese = [{ cosa, cent, chi, tra: ["Marta", ...] }]. Gli importi sono in centesimi: niente errori di arrotondamento.
  let stato = { persone: [], spese: [] };

  const euro = (cent) => (cent / 100).toLocaleString("it-IT", { style: "currency", currency: "EUR" });

  // Il link condiviso porta i dati dopo il "#", codificati in base64 (UTF-8, così funzionano gli accenti).
  const codifica = (o) => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))));
  const decodifica = (s) => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0))));

  function carica() {
    try {
      if (location.hash.startsWith("#d=")) {
        stato = decodifica(location.hash.slice(3));
        history.replaceState(null, "", location.pathname);
        salva();
        return;
      }
      const s = localStorage.getItem(CHIAVE);
      if (s) stato = JSON.parse(s);
    } catch (e) { /* dati illeggibili: si riparte vuoti */ }
  }
  function salva() {
    try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) { /* navigazione privata: si lavora solo in memoria */ }
  }

  // Divide "cent" tra le persone: i centesimi che avanzano vanno ai primi, così il totale torna sempre.
  function quote(cent, tra) {
    const base = Math.floor(cent / tra.length);
    let resto = cent - base * tra.length;
    return tra.map((p) => [p, base + (resto-- > 0 ? 1 : 0)]);
  }

  function saldi() {
    const s = Object.fromEntries(stato.persone.map((p) => [p, 0]));
    for (const sp of stato.spese) {
      if (s[sp.chi] === undefined) continue;
      const tra = sp.tra.filter((p) => s[p] !== undefined);
      if (!tra.length) continue;
      s[sp.chi] += sp.cent;
      for (const [p, q] of quote(sp.cent, tra)) s[p] -= q;
    }
    return s;
  }

  // Il minimo di bonifici: chi deve di più paga chi deve ricevere di più, finché tutti sono a zero.
  function bonifici(s) {
    const dare = Object.entries(s).filter(([, v]) => v < 0).map(([p, v]) => [p, -v]).sort((a, b) => b[1] - a[1]);
    const avere = Object.entries(s).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const fuori = [];
    let i = 0, j = 0;
    while (i < dare.length && j < avere.length) {
      const x = Math.min(dare[i][1], avere[j][1]);
      fuori.push([dare[i][0], avere[j][0], x]);
      dare[i][1] -= x;
      avere[j][1] -= x;
      if (dare[i][1] === 0) i++;
      if (avere[j][1] === 0) j++;
    }
    return fuori;
  }

  function disegna() {
    // persone
    const box = $("persone");
    box.innerHTML = "";
    stato.persone.forEach((p) => {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = p;
      const x = document.createElement("button");
      x.textContent = "✕";
      x.title = "Togli " + p;
      x.onclick = () => {
        if (stato.spese.some((s) => s.chi === p || s.tra.includes(p)) && !confirm(`${p} compare in alcune spese. Lo togli lo stesso?`)) return;
        stato.persone = stato.persone.filter((q) => q !== p);
        salva(); disegna();
      };
      c.appendChild(x);
      box.appendChild(c);
    });

    // chi paga e tra chi si divide
    const sel = $("chiPaga");
    const prima = sel.value;
    sel.innerHTML = stato.persone.length ? "" : "<option>Prima aggiungi le persone</option>";
    stato.persone.forEach((p) => sel.add(new Option("Ha pagato " + p, p)));
    if (stato.persone.includes(prima)) sel.value = prima;
    const tra = $("tra");
    const spuntati = new Set([...tra.querySelectorAll("input:checked")].map((i) => i.value));
    const nuovo = !tra.childElementCount;
    tra.innerHTML = stato.persone.length ? "Divisa tra: " : "";
    stato.persone.forEach((p) => {
      const l = document.createElement("label");
      const i = document.createElement("input");
      i.type = "checkbox";
      i.value = p;
      i.checked = nuovo || spuntati.has(p) || !tra.dataset.visti?.split("\u0001").includes(p);
      l.append(i, p);
      tra.appendChild(l);
    });
    tra.dataset.visti = stato.persone.join("\u0001");

    // spese
    const el = $("spese");
    el.innerHTML = stato.spese.length ? "" : '<p class="vuoto">Ancora nessuna spesa.</p>';
    stato.spese.forEach((s, k) => {
      const r = document.createElement("div");
      r.className = "spesa";
      r.innerHTML = '<div class="cosa"><b></b><small></small></div><span class="soldi"></span><button title="Togli">✕</button>';
      r.querySelector("b").textContent = s.cosa || "Spesa";
      r.querySelector("small").textContent = `pagata da ${s.chi} · divisa tra ${s.tra.length === stato.persone.length ? "tutti" : s.tra.join(", ")}`;
      r.querySelector(".soldi").textContent = euro(s.cent);
      r.querySelector("button").onclick = () => { stato.spese.splice(k, 1); salva(); disegna(); };
      el.appendChild(r);
    });

    // saldi e bonifici
    const s = saldi();
    $("saldi").innerHTML = "";
    Object.entries(s).forEach(([p, v]) => {
      const r = document.createElement("div");
      r.className = "saldo";
      r.innerHTML = `<span></span><span class="${v > 0 ? "piu" : v < 0 ? "meno" : ""}">${v > 0 ? "+" : ""}${euro(v)}</span>`;
      r.firstChild.textContent = p;
      $("saldi").appendChild(r);
    });
    const b = bonifici(s);
    $("bonifici").innerHTML = "";
    if (!stato.spese.length) $("bonifici").innerHTML = '<p class="vuoto">Aggiungi una spesa per vedere i conti.</p>';
    else if (!b.length) $("bonifici").innerHTML = '<div class="bonifico" style="background: var(--verde)">Siete pari!</div>';
    b.forEach(([da, a, x]) => {
      const r = document.createElement("div");
      r.className = "bonifico";
      r.textContent = `${da} dà ${euro(x)} a ${a}`;
      $("bonifici").appendChild(r);
    });
  }

  $("aggiungiNome").onclick = () => {
    const n = $("nuovoNome").value.trim();
    if (!n || stato.persone.includes(n)) return;
    stato.persone.push(n);
    $("nuovoNome").value = "";
    salva(); disegna();
    $("nuovoNome").focus();
  };
  $("nuovoNome").addEventListener("keydown", (e) => { if (e.key === "Enter") $("aggiungiNome").click(); });

  $("aggiungiSpesa").onclick = () => {
    const errore = (t) => { $("erroreSpesa").textContent = t; $("erroreSpesa").hidden = !t; };
    // "42,50", "1.200,50" e "42.50" valgono tutti: con la virgola i punti sono migliaia, senza virgola il punto è il decimale.
    const v = $("quanto").value.trim().replace(/[€\s]/g, "");
    const cent = Math.round(parseFloat(v.includes(",") ? v.replace(/\./g, "").replace(",", ".") : v) * 100);
    const tra = [...$("tra").querySelectorAll("input:checked")].map((i) => i.value);
    if (!stato.persone.length) return errore("Prima aggiungi le persone.");
    if (!(cent > 0)) return errore("Scrivi quanto è costato (es. 42,50).");
    if (!tra.length) return errore("Spunta almeno una persona.");
    errore("");
    stato.spese.push({ cosa: $("cosa").value.trim(), cent, chi: $("chiPaga").value, tra });
    $("cosa").value = "";
    $("quanto").value = "";
    salva(); disegna();
    $("cosa").focus();
  };
  $("quanto").addEventListener("keydown", (e) => { if (e.key === "Enter") $("aggiungiSpesa").click(); });

  // Copia negli appunti; se il browser non lo permette (per esempio aprendo il file dal PC), mostra il testo da copiare a mano.
  async function copia(bottone, testo, fatto) {
    const prima = bottone.textContent;
    try {
      await navigator.clipboard.writeText(testo);
      bottone.textContent = fatto;
    } catch (e) {
      prompt("Copia questo testo:", testo);
    }
    setTimeout(() => (bottone.textContent = prima), 2000);
  }

  // Il riepilogo funziona sempre: è testo da incollare nel gruppo (WhatsApp, Telegram…).
  function testoRiepilogo() {
    const tot = stato.spese.reduce((s, x) => s + x.cent, 0);
    const righe = ["💸 Spese", ...stato.spese.map((s) => `• ${s.cosa || "Spesa"}: ${euro(s.cent)} (pagata da ${s.chi})`), `Totale: ${euro(tot)}`, ""];
    const b = bonifici(saldi());
    righe.push(b.length ? "Per andare pari:" : "Siamo pari!");
    b.forEach(([da, a, x]) => righe.push(`➡️ ${da} dà ${euro(x)} a ${a}`));
    return righe.join("\n");
  }
  $("riepilogo").onclick = () => {
    if (!stato.spese.length) return;
    copia($("riepilogo"), testoRiepilogo(), "Riepilogo copiato!");
  };

  // Il link con i dati serve solo se la pagina è su un sito pubblico: da un file sul PC o da localhost gli altri non lo aprirebbero.
  const online = location.protocol === "https:" && !["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  $("condividi").hidden = !online;
  $("condividi").onclick = () => copia($("condividi"), location.href.split("#")[0] + "#d=" + codifica(stato), "Link copiato!");
  $("azzera").onclick = () => {
    if (!confirm("Cancello persone e spese?")) return;
    stato = { persone: [], spese: [] };
    salva(); disegna();
  };

  carica();
  disegna();
</script>
</body>
</html>
